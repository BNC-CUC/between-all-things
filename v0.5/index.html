<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万物之间 · 河湾之初 · 空间灰盒</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;color:#314535}canvas{display:block;width:100vw;height:100vh;touch-action:none}aside{position:fixed;top:16px;left:16px;max-width:min(440px,calc(100vw - 64px));padding:16px;background:#f8f4e8e8;border-radius:16px;box-shadow:0 6px 30px #34443318}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.6;margin:6px 0}button{border:1px solid #b4bba8;border-radius:8px;background:#fffaf0;padding:8px;margin:3px;color:inherit}label{font-size:12px}#status{position:fixed;bottom:16px;left:16px;right:16px;background:#f8f4e8ed;padding:12px;border-radius:10px;font-size:13px}</style><canvas aria-label="河湾立体空间灰盒"></canvas><aside><h1>万物之间 · 河湾之初</h1><p>创造循环原型 · 在左岸播种，照看水肥，等待果实吸引搬运者。</p><p><select id="tool"><option value="sow">播种</option><option value="water">浇水</option><option value="fertilize">补充肥力</option><option value="move-resource">搬放果实（先选后放）</option></select><button id="pause">暂停世界</button></p><p id="counts"></p><p id="land">指向土地查看环境</p><button id="orbit">自由观察</button><button id="top">俯视建设</button><button id="reset">恢复视角</button><button id="bottom" hidden>实验底视</button><p>点击使用工具 · 拖动环绕 · 右键平移<br>滚轮缩放 · 触屏双指缩放与平移</p><label><input type="checkbox" id="experimental">实验俯仰（地表下方仅观察）</label></aside><div id="status">先在左侧岸地播种。水肥充足才生长；金色果实可搬放，搬运者自行寻路。数值暂定，刷新会重置。</div><script src="./app.js"></script></html>
